name: Manual Build DEB
on:
  workflow_dispatch:

jobs:
  build:
    name: Build YTLite DEB
    runs-on: macos-latest
    steps:
      - name: Checkout YTLite
        uses: actions/checkout@v4
        with:
          ref: v5.2b4
          path: YTLite
          submodules: recursive

      - name: Checkout YouTubeHeader
        uses: actions/checkout@v4
        with:
          repository: PoomSmart/YouTubeHeader
          path: YouTubeHeader

      - name: Checkout PSHeader
        uses: actions/checkout@v4
        with:
          repository: PoomSmart/PSHeader
          path: PSHeader

      - name: Checkout YTVideoOverlay
        uses: actions/checkout@v4
        with:
          repository: PoomSmart/YTVideoOverlay
          path: YTVideoOverlay

      - name: Checkout Full Protobuf Runtime
        uses: actions/checkout@v4
        with:
          repository: google/protobuf
          ref: v3.25.1
          path: protobuf_full
          sparse-checkout: |
            objectivec

      - name: Install Dependencies
        run: brew install make ldid dpkg

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
          echo "~/theos/bin" >> $GITHUB_PATH

      - name: Download iOS SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk ~/theos/sdks

      - name: Prepare Header Structure
        run: |
          mkdir -p protobuf
          cp -r protobuf_full/objectivec protobuf/
          ln -s YouTubeHeader YTHeaders 2>/dev/null || true

      - name: Download Roothide Header
        run: |
          curl -Lo ~/theos/include/roothide.h https://raw.githubusercontent.com/roothide/libroothide/main/roothide.h

      - name: Build Tweak
        run: |
          cd YTLite
          make clean package FINALPACKAGE=1 ADDITIONAL_OBJCFLAGS="-I../protobuf/objectivec"
        env:
          THEOS: ~/theos

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytlite-free-deb
          path: YTLite/packages/*.deb
